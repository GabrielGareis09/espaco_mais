<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/calendario.css">
    <title>CALENDÁRIO - ESPAÇO+</title>
</head>

<body>
    <header class="navbar">
        <div class="logo">
            <h1>Espaço</h1>
            <h1 class="mais">+</h1>
        </div>

        <div class="links">
            <a href="../html/dashboard.html" class="desativado">Dashboard</a>
            <a href="../html/minhasReservas.html" class="desativado">Reservas</a>
            <a href="../html/espacos.html" class="desativado">Espaços</a>
            <a href="../html/calendario.html" class="ativo">Calendário</a>
        </div>

        <div class="perfil">
            <div class="fotoPerfil">GG</div>
            <div class="infoPerfil">
                <h1 class="nomePerfil">Gabriel Gareis</h1>
                <h1 class="cargoPerfil">Professor</h1>
            </div>
        </div>
    </header>

    <main>
        <div class="boasVindas">
            <div class="txtBoasVindas">
                <h1>Calendário</h1>
                <h2>Consulte as reservas dos espaços escolares.</h2>
            </div>
            <div>
                <a href="../html/novaReserva.html"><button>+ Nova Reserva</button></a>
            </div>
        </div>

        <div class="filtrosCalendario">
            <h1>Visualizar:</h1>
            <select>
                <option>Todos os Espaços</option>
                <option>Informática</option>
                <option>Laboratório</option>
                <option>Auditório</option>
            </select>
        </div>

        <div class="calendario">
            <div class="topoCalendario">
                <div class="mesAno">
                    <h1 id="mesCalendario">Agosto</h1>
                    <h2 id="anoCalendario">2026</h2>
                </div>
                <div class="setasMes">
                    <button id="mesAnterior">&lt;</button>
                    <button id="mesProximo">&gt;</button>
                </div>
            </div>
            <div class="diasSemana">
                <div>DOM</div>
                <div>SEG</div>
                <div>TER</div>
                <div>QUA</div>
                <div>QUI</div>
                <div>SEX</div>
                <div>SÁB</div>
            </div>
            <div class="diasCalendario" id="diasCalendario"></div>

        </div>
    </main>

    <script src="../js/calendario.js"></script>

</html>
